[project]
name = "quietminutes"
version = "0.2.0"
description = "Private, on-device meeting transcription for Windows (no admin, no cloud)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
# Loose ranges for developers; setup.bat installs the exact tested set from requirements.txt.
dependencies = [
    # capture
    "pyaudiowpatch>=0.2.12",
    "numpy>=2.0",
    "soundfile>=0.13",
    # tray + hotkey + UI
    "pystray>=0.19",
    "Pillow>=10",
    "customtkinter>=5.2,<6",
    "pynput>=1.7",
    "pywebview>=6.2",
    # on-device transcription
    "faster-whisper>=1.2",
    # speaker diarization: sherpa-onnx (built-in fallback) + pyannote 3.1 (default).
    # Pinned: newer huggingface_hub drops use_auth_token; torchaudio must match torch;
    # pyannote 4 needs a gated PLDA model.
    "sherpa-onnx>=1.13",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pyannote.audio==3.3.2",
    "huggingface_hub==0.25.2",
    "matplotlib>=3.9",  # imported by pyannote's pipeline module
    # AI notes use stdlib urllib (Gemini REST / local Ollama): no extra deps.
]

[project.scripts]
quietminutes = "quietminutes.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quietminutes"]
